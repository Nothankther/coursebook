name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install coursebook
        run: pip install .

      - name: Build examples
        run: |
          for d in demo labview; do
            (cd examples/$d && coursebook build)
            mkdir -p _site/$d
            cp examples/$d/index.html _site/$d/index.html
          done

      - name: Landing page
        run: |
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>coursebook · 示例</title>
          <style>
            body{max-width:720px;margin:0 auto;padding:56px 24px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#1a1a1a;line-height:1.8}
            h1{font-size:24px;margin:0 0 6px}
            p.sub{color:#666;font-size:14px;margin:0 0 32px}
            a.card{display:block;padding:18px 20px;border:1px solid #e5e7eb;border-radius:10px;text-decoration:none;color:inherit;margin-bottom:14px;transition:.15s}
            a.card:hover{border-color:#0f766e;box-shadow:0 2px 10px rgba(15,118,110,.08)}
            a.card b{font-size:16px;color:#0f766e}
            a.card span{display:block;font-size:13px;color:#666;margin-top:4px}
          </style>
          </head>
          <body>
            <h1>coursebook 示例</h1>
            <p class="sub">同一套工具，两份不同学科的手册</p>
            <a class="card" href="labview/">
              <b>虚拟仪器技术</b>
              <span>8 章 · 21 张表 · 8 道例题 · 数据采集与仪器总线</span>
            </a>
            <a class="card" href="demo/">
              <b>语法演示</b>
              <span>最小示例：公式、表格、盒子、折叠例题、自测</span>
            </a>
          </body>
          </html>
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
