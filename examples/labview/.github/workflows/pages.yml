name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 本工作流部署的是仓库里已构建好的 index.html。
      # 若希望在 CI 里重建，加一步：
      #   - uses: actions/setup-python@v5
      #     with: { python-version: '3.12' }
      #   - run: pip install git+https://github.com/<you>/coursebook
      #   - run: coursebook build
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
