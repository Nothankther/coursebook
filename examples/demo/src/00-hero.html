<header class="hero">
  <div class="wrap">
    <div class="eyebrow">Course Review</div>
    <h1>{{title}}
      <span class="thin">{{subtitle}}</span>
    </h1>
    <p class="lead">
      把课程笔记整理成一本可搜索、可交互、可打印的单文件手册。
      每章按固定结构展开：<b>知识框架 → 核心公式 → 典型例题 → 易错清单 → 自测</b>。
    </p>
    <div class="meta">
      <span>章节：按需增删</span>
      <span>公式：MathJax 离线渲染</span>
      <span>支持打印 / 导出 PDF</span>
    </div>
  </div>
</header>
